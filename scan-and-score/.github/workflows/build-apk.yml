name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Copy scanner engine files into the app
        run: npm run prepare-www

      - name: Create the Android project
        run: npx cap add android

      - name: Camera permission + portrait lock
        run: node scripts/patch-android.js

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Scan-and-Score-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
